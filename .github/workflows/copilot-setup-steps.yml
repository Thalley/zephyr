name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      # Keep the repo at the workspace root; the Copilot agent expects it there.
      # The parent directory acts as the guide's ~/zephyrproject (west topdir).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          threshold_kib=$((10 * 1024 * 1024))  # 10 GiB in KiB
          avail_kib=$(df -k --output=avail "$GITHUB_WORKSPACE" | tail -n1 | tr -d ' ')
          echo "Available: $((avail_kib / 1024 / 1024)) GiB"
          if [ "$avail_kib" -lt "$threshold_kib" ]; then
            echo "Less than 10 GiB free, removing unused tools..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            echo "Removed"
            df -h "$GITHUB_WORKSPACE"
          else
            echo "Enough free space, skipping cleanup"
          fi

      # To improve the install time for the required packages for Zephyr, we use a cache
      - name: Prepare apt cache dir
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          echo "APT_WEEK=$(date +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}-${{ env.APT_WEEK }}
          restore-keys: |
            apt-${{ runner.os }}-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}-
            apt-${{ runner.os }}-

      # This step will attempt to install the required packages as per the Getting Started guide
      # and if that fails, it will attempt an update and retry the install.
      # Finally, if the install succeeds, it will cache the packages.
      - name: Install host deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5"
          PKGS="git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1"

          # Use the image's package lists first: no upgrades of preinstalled packages
          if ! sudo apt-get install -y --no-install-recommends $APT_OPTS $PKGS; then
            echo "Install failed (stale package lists?); running apt-get update and retrying"

            # Remove unused Microsoft repositories for a quicker update
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources

            sudo timeout 120 apt-get update -o Acquire::Retries=5
            sudo apt-get install -y --no-install-recommends $APT_OPTS $PKGS
          fi

          # Cleanup old cache entries that are not longer valid
          sudo apt-get autoclean $APT_OPTS

          # Let the cache action (running as runner) read and save the debs
          sudo chown -R "$USER" "$HOME/apt-archives"

          # Verify that the apt-archives isn't empty
          du -sh "$HOME/apt-archives"

      - name: Set paths
        run: |
          TOPDIR="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          echo "SDK_TOOLCHAINS=x86_64-zephyr-elf arm-zephyr-eabi" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOPDIR=$TOPDIR" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$TOPDIR/.venv" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      # Getting Started: "Get Zephyr and install Python dependencies"
      - name: Create and activate Python virtual environment
        run: |
          python3 -m venv "$VIRTUAL_ENV"
          # Equivalent of `source .venv/bin/activate` for all later steps and the agent
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Install west
        run: pip install -U pip wheel west

      - name: West init/update
        run: |
          west init -l .
          west update --narrow -o=--depth=1

      - name: Install Python dependencies
        run: |
          west packages pip --install || pip install -r scripts/requirements.txt

      - name: Export Zephyr CMake package
        run: west zephyr-export

      # Getting Started: "Install the Zephyr SDK"
      - name: Read SDK version
        run: echo "SDK_VERSION=$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Cache Zephyr SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.SDK_VERSION }}
          key: sdk-${{ runner.os }}-${{ hashFiles('SDK_VERSION') }}-${{ env.SDK_TOOLCHAINS }}

      - name: Install Zephyr SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: west sdk install -b "$HOME" -t $SDK_TOOLCHAINS

      # Registers the SDK CMake package (~/.cmake); needed on cache hits too
      - name: Register Zephyr SDK
        run: |
          cd "$HOME/zephyr-sdk-${SDK_VERSION}"
          ./setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-${SDK_VERSION}" >> "$GITHUB_ENV"

      # Compiler cache for builds done by the setup and the agent
      - name: Cache ccache data
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.CCACHE_TIMESTAMP }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Set up ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z

      - name: Cache BabbleSim
        id: bsim-cache
        uses: actions/cache@v4
        with:
          path: ~/bsim
          key: bsim-${{ hashFiles('west.yml') }}

      - name: Build BabbleSim
        if: steps.bsim-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch only the BabbleSim projects, at the revisions pinned in west.yml
          west config manifest.group-filter -- +babblesim
          BSIM_PROJECTS=$(west list -f '{name}' | grep -E '^(bsim|babblesim)' || true)
          if [ -z "$BSIM_PROJECTS" ]; then
            echo "No BabbleSim projects found in the manifest"
            exit 1
          fi
          echo "Fetching: $BSIM_PROJECTS"
          west update --narrow -o=--depth=1 $BSIM_PROJECTS

          cp -a "$ZEPHYR_TOPDIR/tools/bsim" "$HOME/bsim"
          if [ ! -f "$HOME/bsim/Makefile" ]; then
            ln -s components/common/Makefile "$HOME/bsim/Makefile"
          fi
          BSIM_BUILD_FAIL_ASAP=1 make -C "$HOME/bsim" everything -j "$(nproc)"

          # Restore the default group filter for the agent's west workspace
          west config -d manifest.group-filter

      - name: Export env for the agent
        run: |
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          echo "BSIM_OUT_PATH=$HOME/bsim" >> "$GITHUB_ENV"
          echo "BSIM_COMPONENTS_PATH=$HOME/bsim/components" >> "$GITHUB_ENV"

      - name: Sanity check
        run: |
          which python west
          python --version
          west --version
          cmake --version
          gcc --version
          ccache --version | head -n1
          ls "$BSIM_OUT_PATH/bin" | head
