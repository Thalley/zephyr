# Overlay to enable BT monitor protocol output in native/bsim builds.
#
# Build with:
#   west build -b nrf52_bsim/native -- \
#     -DEXTRA_CONF_FILE=overlay-monitor.conf
#
# Run with (write to a file, default /tmp/bt_monitor.log):
#   ./bs_nrf52_bsim_native_tests_bsim_bluetooth_host_gatt_general_prj_conf \
#     -s=sim -d=0 -testid=gatt_client --bt_mon_file=/tmp/client.log
#   btmon -r /tmp/client.log
#
# Or for live capture via a named pipe:
#   mkfifo /tmp/btmon.fifo && btmon -r /tmp/btmon.fifo &
#   ./bs_... -s=sim -d=0 -testid=gatt_client --bt_mon_file=/tmp/btmon.fifo
CONFIG_BT_DEBUG_MONITOR_NATIVE=y
