common:
  tags:
    - bluetooth
    - host
tests:
  bluetooth.host.adv.bt_le_ext_adv_foreach:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
    platform_allow:
      - native_sim
      - native_sim/native/64
